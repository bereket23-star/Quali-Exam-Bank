name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - name: Write app config
        run: echo "{\"repo\":\"${{ github.repository }}\",\"version\":${{ github.run_number }},\"versionName\":\"1.${{ github.run_number }}\"}" > www/config.json
      - run: npx cap add android
      - name: Allow notifications
        run: python3 scripts/add_permission.py
      - name: Icons and splash screen
        run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Set version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease assembleDebug
      - name: Sign release APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks keystore.jks --ks-pass pass:qualibank2026 --key-pass pass:qualibank2026 --ks-key-alias quali --out QualiExamBank.apk aligned.apk
          $BT/apksigner verify QualiExamBank.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QualiExamBank-apk
          path: QualiExamBank.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QualiExamBank-debug-fallback
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Quali Exam Bank v1.${{ github.run_number }}
          files: QualiExamBank.apk
